[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sportwire"
version = "0.5.9"
description = "NBA/NFL news and game-data aggregator with periodic Telegram brief"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# Kept in step with requirements.txt. Versions are pinned to what was installed and
# verified, per CLAUDE.md §11 -- every entry has a stated reason for existing.
dependencies = [
    "requests==2.34.2",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.1",
]

# The project uses a flat layout with several top-level packages, which setuptools refuses
# to auto-discover -- it will not guess which directories are packages and which are not.
# Listing them explicitly is the fix. `[VERIFIED]` Without this, `pip install -e .` fails
# with "Multiple top-level packages discovered in a flat-layout", which a CI simulation
# caught before the first push.
[tool.setuptools]
packages = ["config", "delivery", "ingestion", "models", "processing", "storage"]

[tool.ruff]
line-length = 88

# Ruff formats Python snippets inside Markdown by default. The project documents commands
# and illustrative code in CLAUDE.md and the ADRs, and reformatting prose files to satisfy a
# Python formatter is the tail wagging the dog. Restrict it to actual source.
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that hit a live source are excluded from the default run and from CI. A suite that
# fails because ESPN is slow teaches you nothing about your own code.
addopts = "-m 'not network'"
markers = [
    "network: hits a live external service; excluded by default, run with -m network",
]
