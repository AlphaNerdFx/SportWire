# Continuous integration.
#
# This workflow deliberately runs `make check` and nothing else. Duplicating the commands
# here would let CI and local development drift apart -- the moment they differ, a green
# badge stops meaning "this works on your machine too".
#
# Network tests are excluded (pyproject sets `-m 'not network'`). A suite that fails because
# ESPN was slow teaches nothing about the code, and a flaky red badge gets ignored, which
# makes the whole thing worthless.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # The wiki is a separate repository and can be edited in the browser, so a wiki-only
  # change never triggers a push event here. A daily run is what catches a wiki edit that
  # points at a file this repository does not have.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches constraint C1: the operator runs WSL2 Ubuntu with Python 3.10. Testing
          # on a version nobody develops against would let real incompatibilities through.
          python-version: "3.10"

      - name: Install dependencies
        run: make install

      # Cloned so `make check` can verify the wiki's links into this repository.
      # `[VERIFIED]` 2026-08-14: the wiki pointed at a renamed ADR for four days, and
      # README.md and SECURITY.md had the same broken link. Failure is tolerated here
      # because a fork has no wiki -- `scripts/check_links.py` then skips that portion
      # loudly rather than reporting a success it has not earned.
      - name: Clone the wiki
        continue-on-error: true
        run: git clone --depth 1 "${{ github.server_url }}/${{ github.repository }}.wiki.git" ../wiki

      - name: Run checks
        env:
          SPORTWIRE_WIKI: ../wiki
        run: make check
