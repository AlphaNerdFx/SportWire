services:
  openclaw-app:
    build: .
    volumes:
      - .:/app
    environment:
      - WHATSAPP_GATEWAY_URL=http://whatsapp-gateway:8080
      - WHATSAPP_API_KEY=claw_stealth_secret_token
      - DATABASE_URL=postgresql+asyncpg://sports_user:sports_password@postgres:5432/sports_db
    depends_on:
      - whatsapp-gateway
      - postgres

  whatsapp-gateway:
    image: evoapicloud/evolution-api:latest
    ports:
      - "8080:8080"
    environment:
      - AUTH_API_KEY=claw_stealth_secret_token
      - DATABASE_ENABLED=false

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=sports_user
      - POSTGRES_PASSWORD=sports_password
      - POSTGRES_DB=sports_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: